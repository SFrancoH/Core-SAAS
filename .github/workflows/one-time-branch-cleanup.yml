name: Cleanup historic branches once
on:
  push:
    branches: [desarrollo]
    paths:
      - .github/workflows/one-time-branch-cleanup.yml
permissions:
  contents: write
jobs:
  cleanup:
    if: "${{ github.event.head_commit.message == 'chore(git): execute one-time historic branch cleanup' }}"
    runs-on: ubuntu-latest
    steps:
      - name: Verify merged PRs, preserve extra commits, delete old branches
        uses: actions/github-script@v7
        with:
          script: |
            const {owner,repo} = context.repo;
            const targets = [["arquitectura/core-saas-inicial","e8af7f70e7fbacc0b09304e2fb9d06d5d4a27ee4"],["chore/core-typescript-standard","3b6eaa6a40b2cd227ac3eb484d0ddd763f67206d"],["docs/core-saas-unificacion-multisede","fbf7687e7e13afc8e604debf9c3e83eb4700ac2b"],["feat/core-identity-multitenant-access","41b1939870641b072a3af2a5c4a456109813cc43"],["feat/core-multisede-rollout-inventory-blueprint","1f9d9d32f6a8893050e733ebe84071e5f772a651"],["feat/core-tenancy-pets-integration","45e2775d1782c729aa007a7ad7bf4c2afd42619a"],["feat/core-user-management-tenant","27c4fa6218a93ba4829b707eee208c975dae2849"],["feat/pets-full-typescript-core-admin-design","a90cd35b95ddbd476b67ef9ec951814a49af7a00"],["feat/pets-tenant-context-phase1","33bcfd148f5c24e9e705a180d86893e251653be6"],["refactor/pets-complete-type-safety","d1a03820036dc9384112262111c82152e460a9b6"]];
            const existing = [];
            const prs = await github.paginate(github.rest.pulls.list,{
              owner,repo,state:"closed",per_page:100
            });
            for (const [name,expectedSha] of targets) {
              if (name === "main" || name === "desarrollo") throw Error("Protected branch");
              const pr=prs.find(item => item.head.ref===name && !!item.merged_at);
              if (!pr) throw Error("Missing merged PR for "+name);
              try {
                const result=await github.rest.git.getRef({owner,repo,ref:"heads/"+name});
                if (result.data.object.sha!==expectedSha) {
                  throw Error("Branch changed, refusing deletion: "+name);
                }
                existing.push(name);
              } catch(err) {
                if (err.status===404) continue;
                throw err;
              }
            }
            // Preserve the two extra commits made after PR #6 merged.
            const backup="tags/backup/core-identity-20261019";
            const backupSha="41b1939870641b072a3af2a5c4a456109813cc43";
            try {
              const tag=await github.rest.git.getRef({owner,repo,ref:backup});
              if (tag.data.object.sha!==backupSha) throw Error("Backup tag conflict");
            } catch(err) {
              if (err.status!==404) throw err;
              await github.rest.git.createRef({
                owner,repo,ref:"refs/"+backup,sha:backupSha
              });
            }
            const deleted=[];
            for (const name of existing) {
              await github.rest.git.deleteRef({owner,repo,ref:"heads/"+name});
              deleted.push(name);
            }
            const remain=await github.paginate(github.rest.repos.listBranches,{
              owner,repo,per_page:100
            });
            const names=remain.map(b=>b.name).sort();
            core.summary.addHeading("Branch cleanup");
            core.summary.addRaw("Deleted: "+deleted.join(", ")+"\n\n");
            core.summary.addRaw("Remaining: "+names.join(", ")+"\n\n");
            core.summary.addRaw("Backup tag: "+backup+"\n");
            await core.summary.write();
            if (names.length!==2 || names[0]!=="desarrollo" || names[1]!=="main") {
              throw Error("Unexpected branches remain: "+names.join(", "));
            }
